<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Quét mã Data Matrix trên iOS, Android và Web — tối ưu iPhone Air Safari.">

  <!-- iPhone Air / Safari: full-bleed + notch/Dynamic Island safe areas -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DataMatrix Reader">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0B1215">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DataMatrix Reader</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Safari iOS: dùng dvh để khớp vùng nhìn thật (tránh cắt đáy bởi thanh URL) */
    html {
      height: 100%;
      height: -webkit-fill-available;
    }

    html, body {
      width: 100%;
      margin: 0;
      padding: 0;
      background: #0B1215;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      position: fixed;
      inset: 0;
      height: 100%;
      height: 100dvh;
      height: -webkit-fill-available;
    }

    flutter-view,
    flt-glass-pane,
    flt-scene-host {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      height: 100dvh !important;
      max-height: -webkit-fill-available !important;
    }

    video {
      object-fit: cover !important;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
