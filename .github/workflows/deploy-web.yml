name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'data/scans.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch mobile_scanner (multi-pass, tryInvert, Android polarity, iOS playsinline)
        run: dart run tool/patch_mobile_scanner.dart

      - name: Build web
        run: flutter build web --release --base-href /ReadDatamatrix/

      - name: Prepare GitHub Pages
        run: |
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
